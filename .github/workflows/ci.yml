name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  GO_VERSION: "1.26.0"

jobs:
  dart:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Report Flutter version
        run: flutter --version
      - name: Get packages
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test plugin
        run: flutter test
      - name: Test example
        working-directory: example
        run: flutter test

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: apple
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Configure Android toolchain
        if: matrix.target == 'android'
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Report Apple toolchain
        if: matrix.target == 'apple'
        run: |
          xcodebuild -version
          pod --version
      - name: Build native Barometer library
        run: bash scripts/build-native.sh ${{ matrix.target }}
      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Report Flutter version
        run: flutter --version
      - name: Build Android example
        if: matrix.target == 'android'
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android unit tests
        if: matrix.target == 'android'
        working-directory: example/android
        run: ./gradlew :barometer_flutter:testDebugUnitTest
      - name: Build iOS example
        if: matrix.target == 'apple'
        working-directory: example
        run: |
          flutter build ios --debug --no-codesign
          flutter build ios --debug --simulator
      - name: Enable KVM for the Android emulator
        if: matrix.target == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration test on an Android emulator
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            flutter test integration_test -d emulator-5554
      - name: Run integration test on an iOS simulator
        if: matrix.target == 'apple'
        timeout-minutes: 25
        working-directory: example
        run: |
          device=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .key as $runtime | .value[] | select(.name | test("^iPhone [0-9]+$")) | "\(.udid) \($runtime) \(.name)"] | sort_by(split(" ")[1] | split("-")[1:] | map(tonumber)) | last')
          echo "$device"
          udid=${device%% *}
          xcrun simctl bootstatus "$udid" -b
          flutter test integration_test -d "$udid" --verbose
      - name: Check tracked files remain unchanged
        run: git diff --exit-code
