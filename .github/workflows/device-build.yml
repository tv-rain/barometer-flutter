name: Device build

# Run manually from the Actions tab: when a change touches the native glue, the
# example, the build scripts or the barometer-go pin, and before an Epic closes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  GO_VERSION: "1.26.0"

jobs:
  build:
    name: Build and test example (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: apple
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Configure Android toolchain
        if: matrix.target == 'android'
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Report Apple toolchain
        if: matrix.target == 'apple'
        run: |
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes ios
      - name: Build native Barometer library
        run: bash scripts/build-native.sh ${{ matrix.target }}
      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Report Flutter version
        run: flutter --version

      # Android: the standalone build and unit tests, then the example's integration test on
      # an x86_64 emulator at API 35 and at API 24, the lowest level a Flutter application
      # runs on, in standalone and in umbrella mode. The standalone library stands in for an
      # umbrella artifact: it binds the same facade, so no internal artifact is needed.
      - name: Build Android example
        if: matrix.target == 'android'
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android unit tests
        if: matrix.target == 'android'
        working-directory: example/android
        run: ./gradlew :barometer_flutter:testDebugUnitTest
      - name: Build Android example in umbrella mode
        if: matrix.target == 'android'
        working-directory: example
        run: flutter build apk --debug -P barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local -P "barometerUmbrellaRepository=$GITHUB_WORKSPACE/android/libs/maven"
      - name: Enable KVM for the Android emulator
        if: matrix.target == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner action runs each script line as its own command, so the umbrella
      # properties are set on the line that uses them.
      - name: Run integration test on an API 35 Android emulator
        if: matrix.target == 'android'
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            bash ../scripts/integration-test.sh emulator-5554
            ORG_GRADLE_PROJECT_barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local ORG_GRADLE_PROJECT_barometerUmbrellaRepository="$GITHUB_WORKSPACE/android/libs/maven" bash ../scripts/integration-test.sh emulator-5554
      - name: Run integration test on an API 24 Android emulator
        if: matrix.target == 'android'
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            bash ../scripts/integration-test.sh emulator-5554
            ORG_GRADLE_PROJECT_barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local ORG_GRADLE_PROJECT_barometerUmbrellaRepository="$GITHUB_WORKSPACE/android/libs/maven" bash ../scripts/integration-test.sh emulator-5554

      # iOS: the device and simulator builds, then the Swift XCTests and the example's
      # integration test on an `iPhone <number>` simulator of the newest iOS runtime on the
      # runner and of the oldest runtime installed, in standalone mode, and on the newest in
      # umbrella mode. The integration test runs from XCTest through the integration_test
      # plugin's native runner, not `flutter test`, whose simulator log stream can miss the
      # application's VM service (docs/apple-validation.md).
      - name: Build iOS example
        if: matrix.target == 'apple'
        working-directory: example
        run: |
          flutter build ios --debug --no-codesign
          flutter build ios --debug --simulator
      # The runner image has no runtime older than iOS 18; Xcode offers some older ones for
      # download. Install the oldest one offered, back to the iOS 15 deployment target, and
      # create an iPhone simulator for it.
      - name: Install the oldest iOS runtime offered
        if: matrix.target == 'apple'
        timeout-minutes: 20
        run: |
          for version in 15.0 15.2 15.4 15.5 16.0 16.1 16.2 16.4 17.0; do
            xcodebuild -downloadPlatform iOS -buildVersion "$version" 2>&1 | grep -v 'Downloading iOS .*%' || true
            runtime=$(xcrun simctl list runtimes ios -j | jq -r --arg v "$version" '.runtimes[] | select(.version == $v or (.version | startswith($v + "."))) | .identifier' | head -n 1)
            [ -n "$runtime" ] && break
          done
          if [ -n "$runtime" ]; then
            type=$(xcrun simctl list runtimes ios -j | jq -r --arg r "$runtime" '.runtimes[] | select(.identifier == $r) | [.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | first | .name')
            xcrun simctl create "$type" "$type" "$runtime"
          fi
          xcrun simctl list runtimes ios
      - name: Select iOS simulators
        if: matrix.target == 'apple'
        run: |
          devices=$(xcrun simctl list devices available -j | jq -c '[.devices | to_entries[] | select(.key | test("iOS")) | .key as $runtime | .value[] | select(.name | test("^iPhone [0-9]+$")) | {udid, runtime: $runtime, name}] | sort_by(.runtime | split("-")[1:] | map(tonumber))')
          jq -r '"newest: \(last | .runtime) \(last | .name)", "oldest: \(first | .runtime) \(first | .name)"' <<<"$devices"
          echo "SIM_NEWEST=$(jq -r 'last | .udid' <<<"$devices")" >> "$GITHUB_ENV"
          echo "SIM_OLDEST=$(jq -r 'first | .udid' <<<"$devices")" >> "$GITHUB_ENV"
      # The XCTests run before the integration tests, which leave the Xcode configuration
      # pointing at the test's entry point.
      - name: Run XCTests on the newest and oldest iOS runtimes
        if: matrix.target == 'apple'
        timeout-minutes: 50
        working-directory: example/ios
        run: |
          for udid in "$SIM_NEWEST" "$SIM_OLDEST"; do
            xcrun simctl bootstatus "$udid" -b > /dev/null
            result="$RUNNER_TEMP/xctests-$udid.xcresult"
            status=0
            xcodebuild test -quiet -workspace Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,arch=arm64,id=$udid" -only-testing:RunnerTests -parallel-testing-enabled NO -resultBundlePath "$result" || status=$?
            xcrun xcresulttool get test-results summary --path "$result" --compact | jq -c '{result, totalTestCount, passedTests, failedTests, skippedTests, device: [.devicesAndConfigurations[].device | "\(.deviceName) \(.osVersion)"]}'
            xcrun simctl shutdown "$udid"
            [ "$status" -eq 0 ] || exit "$status"
          done
      - name: Run integration test on the newest and oldest iOS runtimes
        if: matrix.target == 'apple'
        timeout-minutes: 45
        working-directory: example
        run: |
          for udid in "$SIM_NEWEST" "$SIM_OLDEST"; do
            xcrun simctl bootstatus "$udid" -b > /dev/null
            bash ../scripts/integration-test.sh "$udid"
            xcrun simctl shutdown "$udid"
          done
      - name: Check tracked files remain unchanged
        run: git diff --exit-code
      # Umbrella mode, run last because pod install may rewrite the Xcode project. The
      # standalone library stands in for an umbrella artifact: it binds the same facade.
      - name: Build iOS example in umbrella mode
        if: matrix.target == 'apple'
        working-directory: example
        env:
          BAROMETER_FLUTTER_UMBRELLA_MODULE: Barometer
        run: |
          mkdir -p ios/umbrella/Frameworks
          ln -s ../../../../ios/Frameworks/Barometer.xcframework ios/umbrella/Frameworks/Barometer.xcframework
          flutter clean
          flutter pub get
          (cd ios && pod install)
          grep -q 'barometer_flutter/Umbrella' ios/Podfile.lock
          flutter build ios --debug --simulator
          # The plugin is linked statically and embeds no library of its own.
          test ! -e build/ios/iphonesimulator/Runner.app/Frameworks/barometer_flutter.framework
      - name: Run XCTests in umbrella mode
        if: matrix.target == 'apple'
        timeout-minutes: 30
        working-directory: example/ios
        env:
          BAROMETER_FLUTTER_UMBRELLA_MODULE: Barometer
        run: |
          xcrun simctl bootstatus "$SIM_NEWEST" -b > /dev/null
          result="$RUNNER_TEMP/xctests-umbrella.xcresult"
          status=0
          xcodebuild test -quiet -workspace Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,arch=arm64,id=$SIM_NEWEST" -only-testing:RunnerTests -parallel-testing-enabled NO -resultBundlePath "$result" || status=$?
          xcrun xcresulttool get test-results summary --path "$result" --compact | jq -c '{result, totalTestCount, passedTests, failedTests, skippedTests, device: [.devicesAndConfigurations[].device | "\(.deviceName) \(.osVersion)"]}'
          exit "$status"
      - name: Run integration test in umbrella mode
        if: matrix.target == 'apple'
        timeout-minutes: 25
        working-directory: example
        env:
          BAROMETER_FLUTTER_UMBRELLA_MODULE: Barometer
        run: bash ../scripts/integration-test.sh "$SIM_NEWEST"
