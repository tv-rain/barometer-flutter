name: Device build

# Run manually from the Actions tab, once per pull request on its final commit, when a
# change touches the native glue, the example, the build scripts or the barometer-go pin,
# choosing only the platforms the change affects; and on all platforms at main before an
# Epic closes.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options:
          - all
          - android
          - apple
        default: all

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  GO_VERSION: "1.26.0"

jobs:
  # Android: the standalone build and unit tests, then the example's integration test on
  # an x86_64 emulator at API 35 and at API 24, the lowest level a Flutter application
  # runs on, in standalone and in umbrella mode. The standalone library stands in for an
  # umbrella artifact: it binds the same facade, so no internal artifact is needed.
  android:
    name: Android
    if: inputs.platforms != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Android toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "SYSTEM_IMAGES=$ANDROID_HOME/system-images" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare build
        uses: ./.github/actions/prepare
        with:
          target: android
          go-version: ${{ env.GO_VERSION }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Gradle's dependency cache; runs on branches read the cache that main wrote.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The emulator system images, whose download from Google once took over half an hour.
      - name: Restore emulator system images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SYSTEM_IMAGES }}/android-35/default/x86_64
            ${{ env.SYSTEM_IMAGES }}/android-24/default/x86_64
          key: android-system-images-35-24-default-x86_64-v1
      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug
      - name: Run Android unit tests
        working-directory: example/android
        run: ./gradlew :barometer_flutter:testDebugUnitTest
      - name: Build Android example in umbrella mode
        working-directory: example
        run: flutter build apk --debug -P barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local -P "barometerUmbrellaRepository=$GITHUB_WORKSPACE/android/libs/maven"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner action runs each script line as its own command, so the umbrella
      # properties are set on the line that uses them.
      - name: Run integration test on an API 35 Android emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            bash ../scripts/integration-test.sh emulator-5554
            ORG_GRADLE_PROJECT_barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local ORG_GRADLE_PROJECT_barometerUmbrellaRepository="$GITHUB_WORKSPACE/android/libs/maven" bash ../scripts/integration-test.sh emulator-5554
      - name: Run integration test on an API 24 Android emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            bash ../scripts/integration-test.sh emulator-5554
            ORG_GRADLE_PROJECT_barometerUmbrellaArtifact=com.tvrain.barometer:barometer:local ORG_GRADLE_PROJECT_barometerUmbrellaRepository="$GITHUB_WORKSPACE/android/libs/maven" bash ../scripts/integration-test.sh emulator-5554
      - name: Check tracked files remain unchanged
        run: git diff --exit-code

  # iOS, in three parallel jobs on an `iPhone <number>` simulator: the newest iOS runtime
  # on the runner, the oldest runtime Xcode offers for download, and the newest in
  # umbrella mode. Each runs the Swift XCTests and then the example's integration test,
  # which runs from XCTest through the integration_test plugin's native runner, not
  # `flutter test`, whose simulator log stream can miss the application's VM service
  # (docs/apple-validation.md).
  apple:
    name: Apple (${{ matrix.variant }})
    if: inputs.platforms != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - newest
          - oldest
          - umbrella
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes ios
      - name: Prepare build
        uses: ./.github/actions/prepare
        with:
          target: apple
          go-version: ${{ env.GO_VERSION }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build iOS example
        if: matrix.variant == 'newest'
        working-directory: example
        run: |
          flutter build ios --debug --no-codesign
          flutter build ios --debug --simulator
      - name: Build iOS example for the simulator
        if: matrix.variant == 'oldest'
        working-directory: example
        run: flutter build ios --debug --simulator
      # The standalone library stands in for an umbrella artifact: it binds the same facade.
      - name: Build iOS example in umbrella mode
        if: matrix.variant == 'umbrella'
        working-directory: example
        run: |
          echo "BAROMETER_FLUTTER_UMBRELLA_MODULE=Barometer" >> "$GITHUB_ENV"
          export BAROMETER_FLUTTER_UMBRELLA_MODULE=Barometer
          mkdir -p ios/umbrella/Frameworks
          ln -s ../../../../ios/Frameworks/Barometer.xcframework ios/umbrella/Frameworks/Barometer.xcframework
          flutter pub get
          # pod install needs the iOS engine artifacts, which no earlier build in this job fetched.
          flutter precache --ios
          (cd ios && pod install)
          grep -q 'barometer_flutter/Umbrella' ios/Podfile.lock
          flutter build ios --debug --simulator
          # The plugin is linked statically and embeds no library of its own.
          test ! -e build/ios/iphonesimulator/Runner.app/Frameworks/barometer_flutter.framework
      # The runner image has no runtime older than iOS 18; Xcode offers some older ones for
      # download. Install the oldest one offered, back to the iOS 15 deployment target, and
      # create an iPhone simulator for it.
      - name: Install the oldest iOS runtime offered
        if: matrix.variant == 'oldest'
        timeout-minutes: 20
        run: |
          for version in 15.0 15.2 15.4 15.5 16.0 16.1 16.2 16.4 17.0; do
            xcodebuild -downloadPlatform iOS -buildVersion "$version" 2>&1 | grep -v 'Downloading iOS .*%' || true
            runtime=$(xcrun simctl list runtimes ios -j | jq -r --arg v "$version" '.runtimes[] | select(.version == $v or (.version | startswith($v + "."))) | .identifier' | head -n 1)
            [ -n "$runtime" ] && break
          done
          if [ -n "$runtime" ]; then
            type=$(xcrun simctl list runtimes ios -j | jq -r --arg r "$runtime" '.runtimes[] | select(.identifier == $r) | [.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))] | first | .name')
            xcrun simctl create "$type" "$type" "$runtime"
          fi
          xcrun simctl list runtimes ios
      - name: Select iOS simulator
        env:
          PICK: ${{ matrix.variant == 'oldest' && 'first' || 'last' }}
        run: |
          devices=$(xcrun simctl list devices available -j | jq -c '[.devices | to_entries[] | select(.key | test("iOS")) | .key as $runtime | .value[] | select(.name | test("^iPhone [0-9]+$")) | {udid, runtime: $runtime, name}] | sort_by(.runtime | split("-")[1:] | map(tonumber))')
          jq -r "$PICK | \"${{ matrix.variant }}: \\(.runtime) \\(.name)\"" <<<"$devices"
          echo "SIM_UDID=$(jq -r "$PICK | .udid" <<<"$devices")" >> "$GITHUB_ENV"
      # The XCTests run before the integration test, which leaves the Xcode configuration
      # pointing at the test's entry point.
      - name: Run XCTests
        timeout-minutes: 30
        working-directory: example/ios
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          result="$RUNNER_TEMP/xctests.xcresult"
          status=0
          xcodebuild test -quiet -workspace Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,arch=arm64,id=$SIM_UDID" -only-testing:RunnerTests -parallel-testing-enabled NO -resultBundlePath "$result" || status=$?
          xcrun xcresulttool get test-results summary --path "$result" --compact | jq -c '{result, totalTestCount, passedTests, failedTests, skippedTests, device: [.devicesAndConfigurations[].device | "\(.deviceName) \(.osVersion)"]}'
          xcrun xcresulttool get test-results tests --path "$result" --compact | jq -r '.. | objects | select(.nodeType? == "Failure Message") | .name'
          exit "$status"
      - name: Run integration test
        timeout-minutes: 25
        working-directory: example
        run: bash ../scripts/integration-test.sh "$SIM_UDID"
      # Umbrella mode adds the framework link and lets pod install rewrite the Xcode project.
      - name: Check tracked files remain unchanged
        if: matrix.variant != 'umbrella'
        run: git diff --exit-code
