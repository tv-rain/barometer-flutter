name: barometer_flutter
description: Flutter plugin for the Barometer embeddable network-measurement library.
version: 0.0.1
homepage: https://github.com/tv-rain/barometer-flutter
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.tvrain.barometer_flutter
        pluginClass: BarometerFlutterPlugin
      ios:
        pluginClass: BarometerFlutterPlugin
